name: Frontend Tests

on:
  push:
    branches: [team5-samikshya]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: ./frontend
        run: npm install

      # Uncomment these if you want to run separate tests
      # - name: Run unit tests
      #   working-directory: ./frontend
      #   run: npm run test:unit

      # - name: Run integration tests
      #   working-directory: ./frontend
      #   run: npm run test:integration

      - name: Run all tests with coverage
        working-directory: ./frontend
        run: npm test

  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3
        run: aws s3 sync build/ s3://${{ secrets.S3_BUCKET_NAME }} --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

  e2e-test:
    name: Cypress E2E Tests
    runs-on: ubuntu-latest
    needs: deploy
    defaults:
      run:
        working-directory: ./e2e-tests
    env:
      CYPRESS_BASE_URL: https://t5.cicdws.bibek-mishra.com.np/
      CYPRESS_API_URL: https://t5-api.cicdws.bibek-mishra.com.np/api/health

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          working-directory: ./e2e-tests
          config: baseUrl=${{ secrets.CYPRESS_BASE_URL }}
          start: "" # No local server
          wait-on: "" # Skip waiting, since we’re testing the deployed URL
