name: Frontend Tests
on:
  push:
    branches: [team5-samikshya]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: ./frontend
        run: npm install

      # - name: Run unit tests
      #   working-directory: ./frontend
      #   run: npm run test:unit

      # - name: Run integration tests
      #   working-directory: ./frontend
      #   run: npm run test:integration

      - name: Run all tests with coverage
        working-directory: ./frontend
        run: npm test

  deploy:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build project
        run: npm run build
      - name: Deploy to S3
        run: echo "Deploying to S3..." # Replace with actual deploy command

  e2e-test:
    name: Cypress E2E Tests
    runs-on: ubuntu-latest
    needs: deploy
    defaults:
      run:
        working-directory: ./e2e-tests
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          working-directory: ./e2e-tests
          start: ""
          wait-on: ""
